[package]
name = "hpkebench"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Spike S6: which HPKE wraps the vault keys (docs/spikes/S6-hpke.md)"

# The candidates, pinned to the versions measured.
[dependencies]
hpke-rs = { version = "=0.8.0", features = ["hazmat", "draft-ietf-hpke-pq"] }
hpke-rs-crypto = "=0.8.0"
hpke-rs-libcrux = { version = "=0.8.0", features = ["draft-ietf-hpke-pq"] }
hpke-rs-rust-crypto = { version = "=0.8.0", features = ["experimental"] }
hpke = { version = "=0.15.1", features = ["mlkem"] }
libcrux-kem = "=0.0.10"
x-wing = { version = "=0.1.1", features = ["hazmat"] }
rand_core = "0.10"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false

# Not part of the core's workspace.
[workspace]
