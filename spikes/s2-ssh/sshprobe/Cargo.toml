[package]
name = "sshprobe"
description = "Spike S2: openward-ssh against real SSH servers (interop matrix and measurements)"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Standalone on purpose: spike code never joins the core workspace.
[workspace]

[dependencies]
openward-ssh = { path = "../../../core/crates/openward-ssh" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
serde_json = "1"
