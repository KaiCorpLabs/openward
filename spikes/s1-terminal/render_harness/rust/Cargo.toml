[package]
name = "render_harness_core"
description = "Spike S1.4/S1.5: Rust side of the Flutter render harness"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-OpenWard-Proprietary"
publish = false

# Standalone on purpose: spike code never joins the core workspace.
[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
openward-ghostty = { path = "../../../../core/crates/openward-ghostty" }
openward-term = { path = "../../../../core/crates/openward-term", features = ["alacritty"] }
portable-pty = "=0.9.0"
s1-corpus = { path = "../../s1-corpus" }
openward-ssh = { path = "../../../../core/crates/openward-ssh" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
serde_json = "1"
