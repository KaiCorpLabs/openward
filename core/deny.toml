# cargo-deny configuration (ADR-007: client dependency policy).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # File-level copyleft, compatible with distributing under Apache-2.0.
    # Allowed with inventory (expected: hpke-rs, serialport).
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
