# cargo-deny configuration (ADR-007: client dependency policy).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Marvin (timing in `rsa`), with no fixed release. It reaches us through
    # russh, which only uses the private key to sign with the user's own RSA
    # key when authenticating; host key checks are public-key operations and
    # are not affected. Recovering the key needs a great many timed signatures,
    # far more than one per login. Revisit when `rsa` ships a constant-time
    # release (ADR-003).
    { id = "RUSTSEC-2023-0071", reason = "rsa timing leak; no fix upstream; only client-side signing with the user's RSA key, see ADR-003" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # File-level copyleft: fine in a larger work under any license, the
    # GPL-3.0 the client gets at launch included.
    # Allowed with inventory (expected: hpke-rs, serialport).
    "MPL-2.0",
]
# Our own crates are not published and keep all rights reserved (LICENSE):
# the list above is for what they pull in.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
