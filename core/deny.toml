# cargo-deny configuration (ADR-007: client dependency policy).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Accepted in ADR-004 / S6 §7: proc-macro-error2 runs only as part of
    # hax's compile-time macros in libcrux, not in the vault at runtime.
    # Reviewed 2026-11-28: no vulnerability/fixed upgrade is reported. Revisit
    # with every hpke-rs/libcrux update; inventory: spec/keys-v1.md.
    { id = "RUSTSEC-2026-0173", reason = "unmaintained compile-time hax macro dependency of pinned libcrux; accepted ADR-004 / S6; review on each update" },
    # Marvin (timing in `rsa`), with no verified constant-time upstream fix
    # (reviewed 2026-11-28: `rsa` 0.10.0 is published, advisory still applies).
    # It reaches us through russh, which only uses the private key to sign with
    # the user's own RSA key when authenticating; host key checks are public-key
    # operations and are not affected. Recovering the key needs a great many
    # timed signatures, far more than one per login (ADR-003).
    { id = "RUSTSEC-2023-0071", reason = "rsa timing leak; no fix upstream; only client-side signing with the user's RSA key, see ADR-003" },
    # Transitive dependency of russh-sftp 3.0.1 in the current tree (reviewed
    # 2026-11-28: russh-sftp 4.0.0 also depends on chrono); marked unmaintained
    # with no security vulnerability or chrono-free upstream replacement yet.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained transitive chrono via russh-sftp; no vulnerability or safe upgrade upstream; revisit on dependency updates" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    # File-level copyleft: fine in a larger work under any license, the
    # GPL-3.0 the client gets at launch included.
    # Allowed with inventory (expected: hpke-rs, serialport).
    "MPL-2.0",
]
# Our own crates are not published and keep all rights reserved (LICENSE):
# the list above is for what they pull in.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own unpublished crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
