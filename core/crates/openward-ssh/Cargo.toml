[package]
name = "openward-ssh"
description = "SSH sessions on russh: generic transport (TCP, ProxyCommand, jump channel), authentication, host trust and forwarding (ADR-003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned exactly: russh pins ssh-key to a release candidate (ADR-003).
russh = "=0.64.1"
tokio = { version = "1", features = ["net", "process", "io-util", "rt", "macros", "sync", "time"] }
anyhow = "1"
hmac = "0.12"
sha1 = "0.10"
data-encoding = "2"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true
