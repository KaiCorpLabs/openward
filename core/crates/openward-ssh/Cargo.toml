[package]
name = "openward-ssh"
description = "SSH sessions on russh: generic transport (TCP, ProxyCommand, jump channel), authentication, host trust and forwarding (ADR-003)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned exactly: russh pins ssh-key to a release candidate (ADR-003).
russh = "=0.64.1"
tokio = { version = "1", features = ["net", "process", "io-util", "rt", "macros", "sync", "time"] }
anyhow = "1"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
thiserror = "2"
zeroize = "1"

[features]
# `connect` with one method whose secrets are all at hand, keyboard-
# interactive answered by guessing at each prompt, and TOTP codes: for the
# spikes and the tests only. The app asks the user (openward-app's
# `connect`), and never builds this in.
test-auth = []

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
tokio = { version = "1", features = ["full", "test-util"] }
# known_hosts files that are not what they say.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
