[package]
name = "openward-pty"
description = "Local terminal on desktop: a shell on a pseudo-terminal (portable-pty)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Pinned exactly: no release since 2025-02; fork if it stalls (ARCHITECTURE §3.2).
portable-pty = "=0.9.0"
anyhow = "1"

[target.'cfg(unix)'.dependencies]
# Signals to process groups, and a reader that notices the shell is gone.
nix = { version = "0.31", features = ["signal", "poll"] }

[lints.rust]
# One `unsafe` block: borrowing the PTY's descriptor, to duplicate it.
unsafe_code = "deny"

[lints.clippy]
all = "warn"
