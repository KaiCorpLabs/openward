[package]
name = "openward-vault"
description = "Local item store on SQLite: hosts, groups, known hosts and settings inheritance (phase 1, not encrypted yet)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openward-proto = { path = "../openward-proto" }
openward-crypto = { path = "../openward-crypto" }
zeroize = "1"
tempfile = "3"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
# Bundled: the same SQLite on every platform, mobile included.
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
ciborium = "0.2"
tempfile = "3"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process"] }
