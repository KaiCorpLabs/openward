[package]
name = "openward-serial"
description = "Serial ports on desktop: the list of them, and one open as a terminal's line (serialport)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openward-proto = { path = "../openward-proto" }
thiserror = "2"

# Desktop only: on iOS it links IOKit's macOS symbols, which iOS lacks, and
# Android's USB serial is a later phase (docs/plan/movil.md).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Pinned exactly, as little-maintained dependencies are (ARCHITECTURE §3.2).
# Without libudev: Linux ports are found in /sys, and neither the build nor
# the package needs libudev.
serialport = { version = "=4.10.1", default-features = false }

[lints]
workspace = true
