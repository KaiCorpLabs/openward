[package]
name = "openward-app"
description = "Use cases behind the UI: the vault, connection plans, authentication that asks the user, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openward-ghostty = { path = "../openward-ghostty" }
openward-fido = { path = "../openward-fido" }
openward-import = { path = "../openward-import" }
openward-pty = { path = "../openward-pty" }
openward-serial = { path = "../openward-serial" }
openward-sftp = { path = "../openward-sftp" }
openward-ssh = { path = "../openward-ssh" }
openward-telnet = { path = "../openward-telnet" }
openward-term = { path = "../openward-term" }
openward-crypto = { path = "../openward-crypto" }
openward-vault = { path = "../openward-vault" }
anyhow = "1"
# A host's character set when it is not UTF-8 (Latin-1, Shift-JIS…).
encoding_rs = "0.8"
# Session logs: gzip for the recordings, JSON for asciicast and their notes.
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Makes keys (the keychain); the same versions russh uses, with RSA.
rand = { version = "0.10", features = ["thread_rng"] }
ssh-key = { version = "=0.7.0-rc.11", features = ["rsa", "rand_core", "encryption"] }
# Writes known_hosts next to itself and then over it.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
zeroize = "1"
getrandom = "0.4"
sha2 = { version = "0.11", features = ["zeroize"] }
zxcvbn = "=3.1.1"
qrcodegen = "=1.8.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=6.0.0-rc.1", default-features = false, features = ["rt-default", "crypto-rust"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["process", "fs"] }

[dev-dependencies]
rusqlite = "0.41"
rand = { version = "0.10", features = ["thread_rng"] }
# Hashed known_hosts names in tests.
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
# Integration tests answer 2FA prompts with codes.
openward-ssh = { path = "../openward-ssh", features = ["test-auth"] }
# Paused time for the connection watcher's tests; agents of the tests' own.
tokio = { version = "1", features = ["test-util", "net"] }
futures = "0.3"
# A security key in software, for logging in with an sk key.
openward-fido = { path = "../openward-fido", features = ["soft"] }
# A pseudo-terminal pair plays a serial cable.
serialport = { version = "=4.10.1", default-features = false }

[lints]
workspace = true
