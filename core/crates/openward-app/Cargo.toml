[package]
name = "openward-app"
description = "Use cases behind the UI: the vault, connection plans, authentication that asks the user, and terminal sessions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
openward-ghostty = { path = "../openward-ghostty" }
openward-import = { path = "../openward-import" }
openward-pty = { path = "../openward-pty" }
openward-sftp = { path = "../openward-sftp" }
openward-ssh = { path = "../openward-ssh" }
openward-term = { path = "../openward-term" }
openward-vault = { path = "../openward-vault" }
anyhow = "1"
# Makes keys (the keychain); the same versions russh uses, with RSA.
rand = { version = "0.10", features = ["thread_rng"] }
ssh-key = { version = "=0.7.0-rc.11", features = ["rsa", "rand_core", "encryption"] }
# Writes known_hosts next to itself and then over it.
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "io-util", "macros"] }
zeroize = "1"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
# Hashed known_hosts names in tests.
data-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
# Integration tests answer 2FA prompts with codes.
openward-ssh = { path = "../openward-ssh", features = ["test-auth"] }
# Paused time for the connection watcher's tests; agents of the tests' own.
tokio = { version = "1", features = ["test-util", "net"] }
futures = "0.3"

[lints]
workspace = true
