[package]
name = "openward-ghostty"
description = "libghostty-vt behind openward-term's TermEngine, with its input encoders (ADR-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
links = "ghostty-vt"

[dependencies]
openward-term = { path = "../openward-term", default-features = false }

# The one crate allowed to use `unsafe` (FFI to libghostty-vt, ARCHITECTURE
# §3.2): the bindings in src/sys.rs and the calls in src/engine*. Everything
# it exposes is safe.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
