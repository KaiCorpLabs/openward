[package]
name = "openward-crypto"
description = "Versioned authenticated envelopes for the encrypted vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }
ed25519-dalek = { version = "=3.0.0", features = ["zeroize"] }
getrandom = "0.4"
sha2 = "0.11"
thiserror = "2"
zeroize = "1"
hkdf = "0.13"
# Enable erasure in the HMAC state used by HKDF.
hmac = { version = "0.13", features = ["zeroize"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
hpke-rs = { version = "=0.8.0", features = ["draft-ietf-hpke-pq"] }
hpke-rs-libcrux = { version = "=0.8.0", features = ["draft-ietf-hpke-pq"] }

[dev-dependencies]
hpke-rs = { version = "=0.8.0", features = ["hazmat", "draft-ietf-hpke-pq"] }
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }
hpke = { version = "=0.15.1", features = ["mlkem"] }
hpke-rs-crypto = "=0.8.0"
libcrux-kem = "=0.0.10"
rand_core = "0.10"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
