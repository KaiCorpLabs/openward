[package]
name = "openward-term"
description = "Terminal state behind a common TermEngine interface, encoded as damage frames for the UI (ADR-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# The engine that lost spike S1 (ADR-002). Kept, off by default, as a second
# reference for the spikes' conformance tests; the product uses
# openward-ghostty.
alacritty = ["dep:alacritty_terminal"]

[dependencies]
# Pinned exactly: the crate makes no stable-API promise (ADR-002).
alacritty_terminal = { version = "=0.26.0", optional = true }

[lints]
workspace = true
