[workspace]
resolver = "3"
members = [
    "crates/openward-app",
    "crates/openward-ffi",
    "crates/openward-ghostty",
    "crates/openward-import",
    "crates/openward-proto",
    "crates/openward-pty",
    "crates/openward-sftp",
    "crates/openward-ssh",
    "crates/openward-term",
    "crates/openward-vault",
]
# Its own workspace: regenerates openward-ghostty's bindings, needs libclang.
exclude = ["crates/openward-ghostty/bindgen-gen"]

[workspace.package]
version = "0.3.2-beta.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Ulzuhan/openward"
# Not on crates.io: the app and the CLI ship as binaries.
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# What the app ships: the core as one library. No symbols (the app finds
# its functions by their exported names, which stay), and the optimizer
# sees across crates. Panics still unwind: flutter_rust_bridge turns them
# into Dart errors.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
