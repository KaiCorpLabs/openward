name: openward
description: "OpenWard, cliente SSH de código abierto"
publish_to: 'none'
version: 0.3.2-beta.1+18

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Whatever flutter_localizations pins.
  intl: any
  # Same version as the flutter_rust_bridge crate in core/crates/openward-ffi.
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  # Builds core/crates/openward-ffi with cargokit and bundles it.
  openward_ffi:
    path: rust_builder
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  file_selector: ^1.1.0
  path: ^1.9.1
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Texts in lib/l10n/*.arb; `flutter gen-l10n` writes the Dart next to them.
  generate: true
  # The fonts' licenses, shown with the others (lib/core/fonts.dart).
  assets:
    - assets/fonts/jetbrains-mono/OFL.txt
    - assets/fonts/ibm-plex/OFL.txt
    - assets/fonts/instrument/OFL-InstrumentSans.txt
    - assets/fonts/instrument/OFL-InstrumentSerif.txt
    - assets/fonts/martian-mono/OFL.txt
    - assets/fonts/share-tech-mono/OFL.txt
    - assets/fonts/vt323/OFL.txt
  # The themes' fonts, all OFL-1.1 (NOTICE). Instrument Sans is a variable
  # font: Flutter maps FontWeight to its weight axis.
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-Italic.ttf
          style: italic
        - asset: assets/fonts/jetbrains-mono/JetBrainsMono-BoldItalic.ttf
          weight: 700
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/ibm-plex/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/ibm-plex/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/ibm-plex/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/ibm-plex/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm-plex/IBMPlexMono-Bold.ttf
          weight: 700
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/instrument/InstrumentSans-Variable.ttf
    - family: Instrument Serif
      fonts:
        - asset: assets/fonts/instrument/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/instrument/InstrumentSerif-Italic.ttf
          style: italic
    - family: Martian Mono
      fonts:
        - asset: assets/fonts/martian-mono/MartianMono-Regular.ttf
        - asset: assets/fonts/martian-mono/MartianMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/martian-mono/MartianMono-Bold.ttf
          weight: 700
    - family: Share Tech Mono
      fonts:
        - asset: assets/fonts/share-tech-mono/ShareTechMono-Regular.ttf
    - family: VT323
      fonts:
        - asset: assets/fonts/vt323/VT323-Regular.ttf
