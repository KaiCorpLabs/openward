include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored cargokit build tool, and code generated by flutter_rust_bridge.
    - rust_builder/**
    - lib/src/rust/**
    - build/**
    - windows/**
    - macos/**
    - linux/**
    - android/**
    - ios/**

linter:
  rules:
    # A future in an async function is awaited or marked unawaited: one
    # that fails would otherwise go without a word.
    - unawaited_futures
