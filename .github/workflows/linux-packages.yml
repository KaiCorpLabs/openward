name: Linux container packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/tool/linux/**'
      - 'app/tool/package-linux.sh'
      - '.github/scripts/install-zig.sh'
      - '.github/workflows/linux-packages.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Verify Linux bootstrap boundaries
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 app/tool/linux/test-bootstrap.py

  package:
    name: Container package (${{ matrix.arch }})
    needs: bootstrap
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Leave room for the container toolchains
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet
      - name: Build the real Linux package
        env:
          RUNTIME: docker
          ARCH: ${{ matrix.arch }}
        run: app/tool/package-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenWard-container-Linux-${{ matrix.arch }}
          path: app/build/OpenWard-*-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14
