name: CI

# While the repository is private, Actions minutes are billed: macOS counts
# 10x and Windows 2x. Pushes and PRs therefore run on Linux only (including
# the iOS/Android compile check), and the macOS/Windows matrix runs weekly or
# on demand. When the repository goes public, run the full matrix on every
# push again.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # openward-ghostty links a prebuilt libghostty-vt, built with Zig at
      # the pinned Ghostty commit and cached per commit and OS.
      - name: Cache location
        shell: bash
        run: echo "OPENWARD_CACHE=$RUNNER_TEMP/openward" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openward/ghostty/build
          key: libghostty-vt-${{ runner.os }}-${{ hashFiles('core/crates/openward-ghostty/GHOSTTY_COMMIT') }}
      - name: Install Zig
        shell: bash
        run: .github/scripts/install-zig.sh
      - name: Build libghostty-vt
        shell: bash
        run: core/crates/openward-ghostty/build-libghostty.sh
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Format
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      # openward-app's connection tests run against the S2 servers; without
      # them (macOS, Windows) they skip.
      - name: Start SSH test servers
        if: runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/up.sh
      - name: Test
        working-directory: core
        env:
          # The reconnection test drops a connection inside a container.
          S2_RUNTIME: docker
        run: |
          cargo test --workspace
          # The reference engine of the spikes, off by default.
          cargo test -p openward-term --features alacritty
      - name: Stop SSH test servers
        if: always() && runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/down.sh

  mobile-check:
    name: Core compiles for mobile targets
    # cargo check does not link, so Linux is enough. Left out: crates that
    # build C for the target (openward-ssh: aws-lc; openward-vault: SQLite)
    # or need a prebuilt library (openward-ghostty), the desktop-only
    # openward-pty, and openward-app and openward-ffi, which use them all.
    # Their mobile builds come with phase 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and targets
        working-directory: core
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Check
        working-directory: core
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android; do
            cargo check --workspace --target "$target" \
              --exclude openward-ghostty --exclude openward-ssh --exclude openward-pty \
              --exclude openward-vault --exclude openward-app --exclude openward-ffi
          done

  termbench:
    name: Spike S1 benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/s1-terminal/termbench
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s1-terminal/termbench
      - name: Lint
        working-directory: spikes/s1-terminal/termbench
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Smoke run
        run: make bench

  ssh:
    name: Spike S2 SSH (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/s2-ssh/sshprobe
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s2-ssh/sshprobe
      - name: Lint and unit tests
        working-directory: spikes/s2-ssh/sshprobe
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # Real servers (OpenSSH 8.9, 9.2, 10.0 and Dropbear) in containers.
      - name: Interoperability matrix
        if: runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: |
          spikes/s2-ssh/servers/up.sh
          cd spikes/s2-ssh/sshprobe && cargo run --release -- matrix
      - name: Stop servers
        if: always() && runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/down.sh

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check
        working-directory: core
        run: cargo deny check
