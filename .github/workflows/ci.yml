name: CI

# The `systems` job decides where the matrix runs. While the repository is
# public, Actions minutes are free: the three systems on every push and PR.
# If it goes private again, minutes are billed (macOS counts 10x, Windows
# 2x), and it falls back by itself to:
# - pushes to main and PRs: Linux only (with the iOS/Android compile check);
# - a version tag (v…): Linux and Windows, so every version is tried on
#   Windows; macOS has gone through `make ci` on the Mac before the tag;
# - the weekly run: the three systems.
# «Run workflow» runs on the systems chosen (the three by default); on a tag
# with the three, it also leaves a draft release with the three packages.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      systems:
        description: Systems to run on
        type: choice
        options: [all, linux-windows, linux]
        default: all

permissions:
  contents: read

jobs:
  systems:
    name: Which systems
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ASKED: ${{ inputs.systems }}
          # Empty in the weekly run's event: it runs the three anyway.
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          all='["ubuntu-latest","macos-latest","windows-latest"]'
          some='["ubuntu-latest","windows-latest"]'
          linux='["ubuntu-latest"]'
          [[ "$PRIVATE" == false && "$EVENT" != workflow_dispatch ]] && EVENT=public
          case "$EVENT:$ASKED" in
            public:*) os="$all" ;;
            schedule:* | workflow_dispatch:all | workflow_dispatch:) os="$all" ;;
            workflow_dispatch:linux-windows) os="$some" ;;
            push:*) if [[ "$REF" == refs/tags/v* ]]; then os="$some"; else os="$linux"; fi ;;
            *) os="$linux" ;;
          esac
          echo "os=$os" | tee -a "$GITHUB_OUTPUT"

  core:
    name: Rust core (${{ matrix.os }})
    needs: systems
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # openward-ghostty links a prebuilt libghostty-vt, built with Zig at
      # the pinned Ghostty commit and cached per commit and OS.
      - name: Cache location
        shell: bash
        run: echo "OPENWARD_CACHE=$RUNNER_TEMP/openward" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openward/ghostty/build
          key: libghostty-vt-${{ runner.os }}-${{ hashFiles('core/crates/openward-ghostty/GHOSTTY_COMMIT') }}
      - name: Install Zig
        shell: bash
        run: .github/scripts/install-zig.sh
      - name: Build libghostty-vt
        shell: bash
        run: core/crates/openward-ghostty/build-libghostty.sh
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      # hidapi's C (security keys) finds devices with libudev.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libudev-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Format
        working-directory: core
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      # openward-app's connection tests run against the S2 servers; without
      # them (macOS, Windows) they skip. mosh-client for its Mosh cases.
      - name: Start SSH test servers
        if: runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: |
          sudo apt-get install -y --no-install-recommends mosh >/dev/null
          spikes/s2-ssh/servers/up.sh
      - name: Test
        working-directory: core
        env:
          # The reconnection test drops a connection inside a container.
          S2_RUNTIME: docker
          # Where the servers run, a test that cannot reach them fails.
          OPENWARD_REQUIRE_SERVERS: ${{ runner.os == 'Linux' && '1' || '' }}
        run: |
          cargo test --workspace
          # The reference engine of the spikes, off by default.
          cargo test -p openward-term --features alacritty
      - name: Stop SSH test servers
        if: always() && runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/down.sh

  mobile-check:
    name: Core compiles for mobile targets
    # cargo check does not link, so Linux is enough. Left out: crates that
    # build C for the target (openward-ssh: aws-lc; openward-vault: SQLite)
    # or need a prebuilt library (openward-ghostty), the desktop-only
    # openward-pty, openward-serial and openward-fido (HID), and
    # openward-app and openward-ffi, which use them all.
    # Their mobile builds come with phase 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain and targets
        working-directory: core
        run: |
          rustup show
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core
      - name: Check
        working-directory: core
        run: |
          for target in aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android; do
            cargo check --workspace --target "$target" \
              --exclude openward-ghostty --exclude openward-ssh --exclude openward-pty \
              --exclude openward-serial --exclude openward-fido \
              --exclude openward-vault --exclude openward-app --exclude openward-ffi
          done

  termbench:
    name: Spike S1 benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/s1-terminal/termbench
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s1-terminal/termbench
      - name: Lint
        working-directory: spikes/s1-terminal/termbench
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
      - name: Smoke run
        run: make bench

  ssh:
    name: Spike S2 SSH (${{ matrix.os }})
    needs: systems
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: spikes/s2-ssh/sshprobe
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s2-ssh/sshprobe
      - name: Lint and unit tests
        working-directory: spikes/s2-ssh/sshprobe
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test
      # Real servers (OpenSSH 8.9, 9.2, 10.0 and Dropbear) in containers.
      - name: Interoperability matrix
        if: runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: |
          spikes/s2-ssh/servers/up.sh
          cd spikes/s2-ssh/sshprobe && cargo run --release -- matrix
      - name: Stop servers
        if: always() && runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/down.sh

  hpke:
    name: Spike S6 HPKE (${{ matrix.os }})
    needs: systems
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/s6-hpke/hpkebench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s6-hpke/hpkebench
      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
      # A vector or an interop check that fails, fails the job; the timings
      # are for the results (docs/spikes/S6-hpke.md).
      - name: Vectors, interop and timings
        run: cargo run --release -- --json "$RUNNER_TEMP/s6-${{ runner.os }}-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s6-hpke-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/s6-${{ runner.os }}-${{ runner.arch }}.json
          retention-days: 14

  sync:
    name: Spike S4 sync (${{ matrix.os }})
    needs: systems
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: spikes/s4-sync/syncsim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: spikes/s4-sync/syncsim
      - name: Lint
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets -- -D warnings
      # The envelope, the clock, and convergence with proptest (2,000 random
      # runs of three devices, with pruned logs and skewed clocks).
      - name: Tests
        run: cargo test
      # A field-clock run that diverges or loses a write fails the job; the
      # rest is for the results (docs/spikes/S4-sync.md).
      - name: Sizes, unlock and 10,000 writes
        run: cargo run --release -- --json "$RUNNER_TEMP/s4-${{ runner.os }}-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s4-sync-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/s4-${{ runner.os }}-${{ runner.arch }}.json
          retention-days: 14

  app:
    name: App (${{ matrix.os }})
    needs: systems
    # Linux on every push: analysis, tests (integration ones under Xvfb) and
    # a release build. Windows (.zip) on every version tag too, and macOS
    # (.dmg) with the weekly run.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.systems.outputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache location
        run: |
          echo "OPENWARD_CACHE=$RUNNER_TEMP/openward" >> "$GITHUB_ENV"
          # Where the window tests leave their screenshots (a --dart-define).
          echo "OPENWARD_SHOTS=$RUNNER_TEMP/openward-shots" >> "$GITHUB_ENV"
      # Its own key: on macOS it also holds the Intel build of the library.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/openward/ghostty/build
          key: libghostty-vt-app-${{ runner.os }}-${{ hashFiles('core/crates/openward-ghostty/GHOSTTY_COMMIT') }}
      - name: Install Zig
        run: .github/scripts/install-zig.sh
      - name: Build libghostty-vt
        run: |
          core/crates/openward-ghostty/build-libghostty.sh
          if [[ "$RUNNER_OS" == macOS ]]; then
            core/crates/openward-ghostty/build-libghostty.sh x86_64-macos
          fi
      - name: Install Rust from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - name: Flutter version
        id: flutter
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev xvfb
      - name: Analyze and unit tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test test/
      # The SSH cases of the window tests run against the S2 servers too.
      - name: Start SSH test servers
        if: runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/up.sh
      - name: Integration tests
        if: runner.os == 'Linux'
        working-directory: app
        env:
          # The reconnection case drops a connection inside a container.
          S2_RUNTIME: docker
        run: |
          # One X server for the whole step.
          Xvfb :99 -screen 0 1920x1200x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          # Flutter's integration tests are flaky on a headless Linux (the
          # app at times vanishes at start): one retry, with a warning. A
          # real failure fails both times.
          # The default reporter in Actions marks tests ✅/❌; with
          # `-r expanded` the app never got past setUpAll here. On Linux
          # `flutter test -d linux` ends with "No tests were found" and a
          # failing exit code even when every test passed, so a run counts
          # as good when no test failed and every test in the file passed
          # or was skipped (✅ or ⏭️).
          once() {
            local log want got
            log="$(mktemp)"
            if flutter test "$1" -d linux --dart-define=OPENWARD_SHOTS="$OPENWARD_SHOTS" \
              --dart-define=OPENWARD_REQUIRE_SERVERS=true 2>&1 | tee "$log"; then
              return 0
            fi
            want="$(grep -cE '^\s*(testWidgets|test)\(' "$1")"
            got="$(grep -cE '^(✅|⏭️)' "$log" || true)"
            echo "$1: $got of $want tests passed or skipped"
            # At least one per testWidgets in the file: a loop makes more.
            ! grep -q "❌" "$log" && [ "$got" -gt 0 ] && [ "$got" -ge "$want" ]
          }
          itest() {
            once "$1" && return 0
            echo "::warning title=Flaky integration test::$1 failed; retrying once"
            once "$1"
          }
          itest integration_test/ffi_test.dart
          itest integration_test/ui_test.dart
          itest integration_test/a11y_test.dart
          # The gallery through `flutter drive`: its driver saves the
          # screenshots, which `flutter test` on Linux does not always keep.
          flutter drive -d linux --driver=test_driver/integration_test.dart \
            --target=integration_test/gallery_test.dart
      - name: Stop SSH test servers
        if: always() && runner.os == 'Linux'
        env:
          S2_RUNTIME: docker
        run: spikes/s2-ssh/servers/down.sh
      # The gallery on macOS and Windows too, in the full runs; a hiccup
      # there does not hold up the packages.
      - name: Review gallery
        if: runner.os != 'Linux'
        continue-on-error: true
        working-directory: app
        run: |
          flutter drive -d "$(echo "$RUNNER_OS" | tr '[:upper:]' '[:lower:]')" \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/gallery_test.dart
      - name: List screenshots
        if: always()
        run: ls -R "$OPENWARD_SHOTS" 2>/dev/null | head -50 || echo "no screenshots"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: OpenWard-screenshots-${{ runner.os }}
          path: ${{ env.OPENWARD_SHOTS }}
          retention-days: 14
          if-no-files-found: ignore
      - name: Package
        working-directory: app
        run: |
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          case "$RUNNER_OS" in
            Linux)
              flutter build linux --release
              tar -C build/linux/x64/release -czf "build/OpenWard-$version-linux-x64.tar.gz" bundle
              ;;
            macOS)
              # A published .dmg comes from its tag; the weekly run's, not.
              if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                FLUTTER=flutter tool/package-macos.sh
              else
                FLUTTER=flutter tool/package-macos.sh --snapshot
              fi
              ;;
            Windows)
              flutter build windows --release
              (cd build/windows/x64/runner && 7z a -tzip "../../../OpenWard-$version-windows-x64.zip" Release)
              ;;
          esac
          ls -la build/OpenWard-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OpenWard-${{ runner.os }}
          path: app/build/OpenWard-*
          retention-days: 14
          if-no-files-found: error

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        working-directory: core
        run: rustup show
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check
        working-directory: core
        run: cargo deny check

  release:
    name: Draft release
    # Only when run by hand on a version tag with the three systems, once
    # the three packages are built. It stays a draft: publishing it is a
    # person's decision.
    if: github.event_name == 'workflow_dispatch' && inputs.systems == 'all' && startsWith(github.ref, 'refs/tags/v')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --dir dist \
            --pattern 'OpenWard-Linux' --pattern 'OpenWard-macOS' --pattern 'OpenWard-Windows'
          version="${TAG#v}"
          # v0.2.0-beta.1 → docs/notas/v0.2.md
          notes="docs/notas/v$(echo "$version" | cut -d. -f1-2).md"
          [[ -f "$notes" ]] || { echo "::error::no release notes at $notes"; exit 1; }
          # The notes link to docs/ with relative paths, which break on the
          # release page: point them at the tagged files.
          sed "s#](\.\./#](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/#g" "$notes" > "$RUNNER_TEMP/notes.md"
          pre=()
          [[ "$version" == *-* ]] && pre=(--prerelease)
          # The packages alone: the .dmg.commit beside the .dmg is for
          # release-tap.sh. One missing stays unexpanded and stops the draft.
          gh release create "$TAG" --draft "${pre[@]}" --verify-tag \
            --title "OpenWard $version" --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*/OpenWard-*.{dmg,zip,tar.gz}
